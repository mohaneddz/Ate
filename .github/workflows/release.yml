name: Test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -q

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pyinstaller
      - shell: pwsh
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ate-windows
          path: |
            release/*.zip
            release/*.zip.sha256

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . build pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --name ate --paths . --collect-all tzdata --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller scripts/frozen_entry.py
      - run: python scripts/build-linux-release.py --binary dist/ate
      - uses: actions/upload-artifact@v4
        with:
          name: ate-linux
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ate-*
          merge-multiple: true
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
