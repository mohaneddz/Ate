[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-cli"
version = "0.8.0"
description = "Personal Webetu meal reservations from a Windows or Linux PC"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "tzdata>=2025.1", "rich>=13.9,<15"]

[project.scripts]
reserve-meals = "reserve_cli.cli:main"
ate = "reserve_cli.short:main"
res = "reserve_cli.short:main"

[tool.setuptools.packages.find]
include = ["reserve_cli*"]
